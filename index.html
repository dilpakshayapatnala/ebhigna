<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strides Landing Page</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="bg"></canvas>

  <!-- Landing page content -->
  <div class="landing-container">

      <!-- Robot Welcome -->
      <div class="robot">
          <img src="robot.png" alt="Robot Welcome" class="robot-img">
      </div>

      <!-- Strides Poster -->
      <div class="poster">
          <img src="strides_poster.jpg" alt="Strides Poster">
      </div>

      <!-- Tap Anywhere Text -->
      <p class="tap-text">TAP ANYWHERE</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
